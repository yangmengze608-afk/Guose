name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:locale
      - run: npm run test:grill
      - run: git diff --check
      - run: npm run demo:workflow -- --inspect
      - run: npm ci --ignore-scripts
        working-directory: examples/guose-demo-app
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: examples/guose-demo-app
